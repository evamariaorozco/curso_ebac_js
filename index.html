<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário HTML integrando JS</title>
    <link rel="stylesheet" href="./main.css" />
</head>
<body>
    <div class="container">
        <h1>Exercício de HTML integrando JS</h1>
        <h2>Número B é maior do que número A?</h2>
        <form id="meuFormulario">
            <input type="number" id="numero-a" required placeholder="Digite o número A" />
            <input type="number" id="numero-b" required placeholder="Digite o número B" />
            <button type="submit" id="btn">Comparar</button>
        </form>
    </div>
    <script src="./main.js"></script>
</body>
</html>
